# CI smoke test for the Pakistan national GHG inventory.
# Every registered sector runner is executed, not just agriculture: a sector can pass its
# unit tests and still have a broken runner, and until this ran only agriculture's did.
# The agriculture manuscript and the nowcasting paper are not built here - they live in the
# companion repository, which runs its own CI against this package.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pdftotext (poppler-utils) is how the evidence layers read their primary sources:
      # the aviation reconciliation study parses OCAC's sectoral sales PDF and the power
      # plant ledger parses NEPRA's State of Industry Report. Both are documents rather
      # than datasets, which is the point - but it means the extractor is a build
      # dependency, not an optional convenience.
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install (gis extras for the geospatial + chart phases)
        run: pip install -e ".[gis,build,semantic]"

      # The executable task registry also drives Make and local builds. CI deliberately
      # uses full strict execution; a developer cache cannot satisfy reproduction.
      - name: Verify committed sector data and indexes
        run: make data-check

      - name: Inventory from the shared task registry
        run: python3 -m pkinv.build --group ci --full --strict --ledger logs/ci_build.json

      - name: The generated docs must match their generator
        # docs/completeness.md is a build artefact. A hand-edit that never reached
        # completeness.py used to survive locally and only surface here.
        run: |
          python3 scripts/make_readme_tables.py --check
          python3 scripts/make_release_cover.py --check
          python3 scripts/make_paper_artefacts.py --check
          python3 scripts/make_availability.py --check
          git diff --exit-code docs/completeness.md outputs/completeness.csv README.md \
            papers/pdf/README.md paper_common/release_cover.tex \
            paper_national/sections/gen_tab_categorygas.tex \
            paper_national/sections/gen_tab_completeness.tex \
            paper_national/generated/availability.tex paper_national/generated/abstract_doi.tex \
            paper_common/generated_availability_tn.tex

      # A manuscript could previously be committed in a non-compiling state and
      # nothing would notice - CI ran the tests but never built a PDF. tectonic is
      # one binary that fetches only the packages a document actually uses, which
      # is far lighter here than installing TeX Live for four short documents.
      - name: Install tectonic
        run: |
          set -e
          cd /tmp
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          test -x ./tectonic
          sudo install -m 0755 ./tectonic /usr/local/bin/tectonic
          tectonic --version

      - name: Compile the manuscripts
        # The railway paper is compiled alongside the national one: its citation keys and
        # cross-references were previously guarded by nothing, and a wrong-but-valid \citep
        # key survived here for months. The other sector papers still compile only locally.
        # The national article compiles under the vendored Copernicus class
        # (paper_common/copernicus/). tectonic does not read TEXINPUTS, so the class files
        # are copied beside the master for the compile and removed afterwards (the
        # alternative, `-Z search-path=../paper_common/copernicus`, depends on the tectonic
        # release; the copy does not). The article is compiled once more after the
        # supplement: the two resolve each other's labels through xr (.aux files).
        run: |
          set -e
          cp paper_common/copernicus/copernicus.cls paper_common/copernicus/copernicus.cfg \
             paper_common/copernicus/copernicus.bst paper_common/copernicus/pdfscreen.sty \
             paper_common/copernicus/pdfscreencop.sty paper_national/
          for d in paper_national papers/railways; do
            [ -d "$d" ] || continue
            for f in "$d"/*.tex; do
              [ -e "$f" ] || continue
              echo "-> $f"
              (cd "$d" && tectonic -X compile --keep-intermediates --print "$(basename "$f")")
            done
          done
          echo "-> paper_national/paper_national.tex (second pass, supplement labels)"
          (cd paper_national && tectonic -X compile --keep-intermediates --print paper_national.tex)
          rm -f paper_national/copernicus.cls paper_national/copernicus.cfg \
                paper_national/copernicus.bst paper_national/pdfscreen.sty \
                paper_national/pdfscreencop.sty
          for d in notes/*/; do
            [ -f "$d/note.tex" ] || continue
            echo "-> $d/note.tex"
            (cd "$d" && tectonic -X compile --keep-intermediates --print note.tex)
          done

      - name: Unit tests
        # test_gis / test_timeseries skip gracefully when the downloaded caches are absent
        run: python3 -m unittest discover tests -v
